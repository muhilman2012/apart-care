map $http_x_forwarded_for $apart_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

map $http_x_forwarded_host $apart_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

map $http_x_forwarded_proto $apart_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name apartcare.site www.apartcare.site _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 5m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(?:css|js|fonts|images|vendor|docs)/.*\.(?:css|js|woff2|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_FOR $apart_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $apart_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $apart_forwarded_proto;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass app:9000;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
