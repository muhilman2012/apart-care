  <g transform="translate(1010 760)"><rect class="box" width="250" height="150" rx="10"/><text class="head" x="18" y="32">REVIEWS</text><text class="field" x="18" y="58">FK/UK ticket_id</text><text class="field" x="18" y="80">FK resident_user_id</text><text class="field" x="18" y="102">rating · comment · verified</text></g>
  <g transform="translate(1300 760)"><rect class="box" width="250" height="150" rx="10"/><text class="head" x="18" y="32">NOTIFICATIONS</text><text class="field" x="18" y="58">notifiable_type · notifiable_id</text><text class="field" x="18" y="80">FK ticket_id · type</text><text class="field" x="18" y="102">data · read_at</text></g>

