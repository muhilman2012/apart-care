  <g transform="translate(430 760)"><rect class="box" width="250" height="150" rx="10"/><text class="head" x="18" y="32">ATTACHMENTS</text><text class="field" x="18" y="58">FK ticket_id · user_id</text><text class="field" x="18" y="80">kind · file_path</text><text class="field" x="18" y="102">mime_type · file_size</text></g>
