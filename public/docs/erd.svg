<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">ERD APART-CARE</title>
  <desc id="desc">Diagram hubungan entitas sistem pengaduan dan perawatan fasilitas apartemen.</desc>
  <defs>
    <style>@font-face{font-family:Jakarta;src:url('../fonts/plus-jakarta-sans-latin.woff2')}text{font-family:Jakarta,Arial,sans-serif;fill:#17211f}.box{fill:#fffdf8;stroke:#b9b7af;stroke-width:2}.core{fill:#e4f2eb;stroke:#0b6b53;stroke-width:3}.head{font-size:20px;font-weight:800}.field{font-size:13px;fill:#52605d}.rel{fill:none;stroke:#52605d;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 6}.label{font-size:12px;font-weight:700;fill:#0b6b53}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#52605d"/></marker>
  </defs>
  <rect width="1600" height="1080" fill="#f3f1ea"/>
  <text x="60" y="60" font-size="34" font-weight="800">ERD APART-CARE</text>
  <text x="60" y="90" font-size="15" fill="#69716e">Skema domain operasional · MySQL 8 · relasi 3NF</text>

  <g transform="translate(60 140)"><rect class="box" width="250" height="130" rx="10"/><text class="head" x="18" y="32">BUILDINGS</text><text class="field" x="18" y="58">PK id · UK code</text><text class="field" x="18" y="80">name · address</text><text class="field" x="18" y="102">is_active</text></g>
  <g transform="translate(360 140)"><rect class="box" width="250" height="145" rx="10"/><text class="head" x="18" y="32">TOWERS</text><text class="field" x="18" y="58">PK id · FK building_id</text><text class="field" x="18" y="80">code · name</text><text class="field" x="18" y="102">total_floors · is_active</text></g>
  <g transform="translate(660 120)"><rect class="core" width="280" height="190" rx="10"/><text class="head" x="18" y="32">QR_LOCATIONS</text><text class="field" x="18" y="58">PK id · FK tower_id</text><text class="field" x="18" y="80">UK uuid · UK code</text><text class="field" x="18" y="102">name · type · tower · floor</text><text class="field" x="18" y="124">zone · description</text><text class="field" x="18" y="146">reference_image_path</text><text class="field" x="18" y="168">installation_notes · is_active</text></g>
  <g transform="translate(1010 120)"><rect class="box" width="250" height="175" rx="10"/><text class="head" x="18" y="32">USERS</text><text class="field" x="18" y="58">PK id · UK email</text><text class="field" x="18" y="80">name · password</text><text class="field" x="18" y="102">role · phone_number</text><text class="field" x="18" y="124">is_active</text></g>
  <g transform="translate(1310 140)"><rect class="box" width="230" height="140" rx="10"/><text class="head" x="18" y="32">SLA_POLICIES</text><text class="field" x="18" y="58">UK priority_level</text><text class="field" x="18" y="80">response_minutes</text><text class="field" x="18" y="102">resolution_minutes</text></g>

