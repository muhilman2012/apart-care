name: apart-care
services:
  app:
    build: .
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [apart-care]
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [apart-care]
  queue:
    build: .
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    restart: unless-stopped
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [apart-care]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: apart_care
      MYSQL_USER: apart_care
      MYSQL_PASSWORD: apart_care
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [apart-care]
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [apart-care]
volumes:
  mysql-data:
networks:
  apart-care:
