name: apart-care
services:
  app:
    build: .
    restart: unless-stopped
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [apart-care]
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [apart-care]
  queue:
    build: .
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=90
    restart: unless-stopped
    volumes: [".:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      whatsapp: { condition: service_started }
    networks: [apart-care]
  whatsapp:
    build: ./services/whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:?WHATSAPP_API_TOKEN wajib diisi di .env}
      CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      - whatsapp-session:/app/session
    shm_size: 512mb
    networks: [apart-care]
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-apart_care}
      MYSQL_USER: ${DB_USERNAME:-apart_care}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apart_care}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [apart-care]
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [apart-care]
volumes:
  mysql-data:
  whatsapp-session:
networks:
  apart-care:
